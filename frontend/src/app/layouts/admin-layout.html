<div class="flex h-screen bg-[#F0F2FF] font-[Inter]">
  <!-- Sidebar -->
  <aside
    [class]="
      sidebarCollapsed()
        ? 'w-16 min-w-[64px] bg-[#0f0a1e] flex flex-col shadow-2xl transition-all duration-300 overflow-hidden'
        : 'w-60 min-w-[240px] bg-[#0f0a1e] flex flex-col shadow-2xl transition-all duration-300'
    "
  >
    <!-- Logo & Toggle -->
    <div class="flex items-center px-3 py-4 border-b border-white/5">
      <button
        (click)="toggleSidebar()"
        class="w-10 h-10 rounded-full bg-[#1e1636] hover:bg-[#2d2150] flex items-center justify-center text-slate-300 border-none cursor-pointer transition-colors shrink-0"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div
        class="flex items-center gap-2 ml-3 overflow-hidden transition-all duration-300"
        [style.width]="sidebarCollapsed() ? '0px' : '160px'"
        [style.opacity]="sidebarCollapsed() ? '0' : '1'"
      >
        <img src="images/logo.png" alt="MyQuiz" class="h-10 w-auto drop-shadow-lg shrink-0" />
        <span
          class="px-2 py-0.5 rounded-md bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-[10px] font-black tracking-widest uppercase shadow-sm whitespace-nowrap"
          >Admin</span
        >
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto overflow-x-hidden">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!bg-indigo-600 !text-white"
          [class]="
            sidebarCollapsed()
              ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
              : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
          "
          [title]="sidebarCollapsed() ? item.label : ''"
        >
          <span class="material-symbols-outlined shrink-0">{{ item.icon }}</span>
          <span
            [class]="
              sidebarCollapsed()
                ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
                : 'transition-all duration-200'
            "
          >
            {{ item.label }}
          </span>
        </a>
        <div class="h-px bg-[#1e1636] mx-2 my-3"></div>
      }
    </nav>

    <!-- User -->
    <div class="px-2 py-3 border-t border-white/5">
      <!-- @if (user()) {
        <div [class]="sidebarCollapsed()
          ? 'flex items-center justify-center px-0 py-2'
          : 'flex items-center gap-3 px-3 py-2'"
        >
          <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white text-[13px] font-black shrink-0">
            {{ (user()!.firstName || 'A').charAt(0).toUpperCase() }}
          </div>
          <div [class]="sidebarCollapsed() ? 'opacity-0 w-0 overflow-hidden transition-all duration-200' : 'min-w-0 flex-1 transition-all duration-200'">
            <p class="text-white text-[12px] font-bold truncate">{{ user()!.firstName }} {{ user()!.lastName }}</p>
            <p class="text-slate-400 text-[10px] truncate">Administrator</p>
          </div>
        </div>
      } -->

      <!-- Logout button -->
      <!-- <div class="h-px bg-[#1e1636] mx-2 my-3"></div>/ -->
      <button
        (click)="logout()"
        [class]="
          sidebarCollapsed()
            ? 'w-full flex items-center justify-center px-0 py-2.5 rounded-xl text-red-400 font-semibold text-[13.5px] transition-all hover:bg-red-500/10 bg-transparent border-none cursor-pointer'
            : 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-red-400 font-semibold text-[13.5px] transition-all hover:bg-red-500/10 bg-transparent border-none cursor-pointer'
        "
        [title]="sidebarCollapsed() ? 'Log out' : ''"
      >
        <span class="material-symbols-outlined shrink-0">logout</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Log out
        </span>
      </button>
    </div>
  </aside>

  <!-- Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar -->
    <header
      class="bg-white border-b border-gray-200 px-8 py-3.5 flex items-center justify-between shrink-0"
    >
      <div class="flex items-center">
        <!-- Back to App button moved to Top Bar -->
        <button
          (click)="goToApp()"
          class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-gray-600 text-[12px] font-bold hover:bg-gray-100 transition-all border border-gray-200 bg-white cursor-pointer shadow-sm hover:shadow"
        >
          <span class="material-symbols-outlined text-[16px]">home</span>
          Back to App
        </button>
      </div>

      <div>
        <!-- Enlarged System Status -->
        @if (isSystemOnline()) {
          <span
            class="inline-flex items-center gap-2 px-4 py-1.5 bg-green-50 border border-green-200 text-green-700 text-[12px] font-bold rounded-full shadow-sm"
          >
            <span class="w-2.5 h-2.5 rounded-full bg-green-600 animate-pulse"></span>
            System Online
          </span>
        } @else {
          <span
            class="inline-flex items-center gap-2 px-4 py-1.5 bg-red-50 border border-red-200 text-red-700 text-[12px] font-bold rounded-full shadow-sm"
          >
            <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse"></span>
            System Offline
          </span>
        }
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
