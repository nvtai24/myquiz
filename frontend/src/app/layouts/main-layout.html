<div class="flex h-screen bg-[#f4f6fb] font-[Inter]">
  <aside
    [class]="
      sidebarCollapsed()
        ? 'w-16 min-w-[64px] bg-[#0f0a1e] flex flex-col shadow-2xl transition-all duration-300 overflow-hidden'
        : 'w-72 min-w-[288px] bg-[#0f0a1e] flex flex-col shadow-2xl transition-all duration-300'
    "
  >
    <div class="flex items-center px-3 py-4 border-b border-white/5">
      <button
        (click)="toggleSidebar()"
        class="w-10 h-10 rounded-full bg-[#1e1636] hover:bg-[#2d2150] flex items-center justify-center text-slate-300 border-none cursor-pointer transition-colors shrink-0"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div
        class="flex items-center gap-2 ml-3 overflow-hidden transition-all duration-300"
        [style.width]="sidebarCollapsed() ? '0px' : '190px'"
        [style.opacity]="sidebarCollapsed() ? '0' : '1'"
      >
        <img src="images/logo.png" alt="MyQuiz" class="h-10 w-auto drop-shadow-lg shrink-0" />
      </div>
    </div>

    <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto overflow-x-hidden">
      <a
        routerLink="/dashboard"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'Home' : ''"
      >
        <span class="material-symbols-outlined shrink-0">home</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Home
        </span>
      </a>
      <div class="h-px bg-[#1e1636] mx-2 my-3"></div>

      <a
        routerLink="/search"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'Explore' : ''"
      >
        <span class="material-symbols-outlined shrink-0">explore</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Explore
        </span>
      </a>
      <div class="h-px bg-[#1e1636] mx-2 my-3"></div>

      <a
        routerLink="/library"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'My Library' : ''"
      >
        <span class="material-symbols-outlined shrink-0">folder_open</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          My Library
        </span>
      </a>
      <div class="h-px bg-[#1e1636] mx-2 my-3"></div>

      <a
        routerLink="/history"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'Quiz History' : ''"
      >
        <span class="material-symbols-outlined shrink-0">history</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Quiz History
        </span>
      </a>
      <div class="h-px bg-[#1e1636] mx-2 my-3"></div>

      <a
        routerLink="/subscription"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'Subscription' : ''"
      >
        <span class="material-symbols-outlined shrink-0">credit_card</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Subscription
        </span>
      </a>
      <div class="h-px bg-[#1e1636] mx-2 my-3"></div>

      <a
        routerLink="/add-deck"
        routerLinkActive="!bg-[#4255FF] !text-white"
        [class]="
          sidebarCollapsed()
            ? 'flex items-center justify-center px-0 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
            : 'flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white'
        "
        [title]="sidebarCollapsed() ? 'Create Study Set' : ''"
      >
        <span class="material-symbols-outlined shrink-0">add</span>
        <span
          [class]="
            sidebarCollapsed()
              ? 'opacity-0 w-0 overflow-hidden whitespace-nowrap transition-all duration-200'
              : 'transition-all duration-200'
          "
        >
          Create Study Set
        </span>
      </a>
    </nav>

    <div class="px-2 pb-2">
      <div
        [class]="
          sidebarCollapsed()
            ? 'relative flex justify-center py-2'
            : 'relative rounded-2xl border border-white/8 bg-white/5 p-3 text-slate-100 shadow-[0_12px_30px_rgba(0,0,0,0.24)]'
        "
      >
        <button
          (click)="toggleProfileMenu()"
          [class]="
            sidebarCollapsed()
              ? 'w-10 h-10 rounded-full border-none bg-[#1e1636] text-[#4255FF] cursor-pointer flex items-center justify-center'
              : 'w-full border-none bg-transparent p-0 cursor-pointer text-left flex items-center gap-3'
          "
          [title]="sidebarCollapsed() ? 'Open user menu' : ''"
        >
          @if (currentUser()?.avatarUrl) {
            <img
              [src]="currentUser()?.avatarUrl"
              alt="Avatar"
              class="w-10 h-10 rounded-full object-cover ring-2 ring-[#4255FF]/70 ring-offset-2 ring-offset-[#120b24] shrink-0"
            />
          } @else {
            <span class="material-symbols-outlined text-[40px] text-[#8ea2ff] shrink-0"
              >account_circle</span
            >
          }

          <span
            [class]="
              sidebarCollapsed()
                ? 'hidden'
                : 'min-w-0 flex-1 flex flex-col overflow-hidden text-left'
            "
          >
            <span class="truncate text-sm font-semibold text-white">
              {{ currentUser()?.firstName || 'Quiz' }} {{ currentUser()?.lastName || 'User' }}
            </span>
            <span class="truncate text-xs text-slate-400">
              {{ currentUser()?.email || 'Manage your account' }}
            </span>
          </span>

          <span
            class="material-symbols-outlined text-slate-400 transition-transform"
            [class]="sidebarCollapsed() ? 'hidden' : profileMenuOpen() ? 'rotate-180' : ''"
          >
            expand_circle_up
          </span>
        </button>

        @if (profileMenuOpen()) {
          <div
            [class]="
              sidebarCollapsed()
                ? 'absolute bottom-[calc(100%+10px)] left-0 w-56 bg-white border border-gray-200 rounded-2xl shadow-xl p-1.5 z-50 animate-[dropdownFade_0.15s_ease]'
                : 'absolute bottom-[calc(100%+12px)] left-2 right-2 bg-[#17102c] border border-white/8 rounded-2xl shadow-xl p-1.5 z-50 animate-[dropdownFade_0.15s_ease]'
            "
          >
            <a
              routerLink="/profile"
              (click)="toggleProfileMenu()"
              [class]="
                sidebarCollapsed()
                  ? 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-gray-800 no-underline hover:bg-gray-100 transition-colors'
                  : 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-slate-100 no-underline hover:bg-white/8 transition-colors'
              "
            >
              <span
                [class]="
                  sidebarCollapsed()
                    ? 'material-symbols-outlined text-[20px] text-gray-500'
                    : 'material-symbols-outlined text-[20px] text-slate-400'
                "
                >person</span
              >
              My Profile
            </a>
            @if (currentUser()?.roles?.includes('Admin')) {
              <a
                routerLink="/admin/dashboard"
                (click)="toggleProfileMenu()"
                [class]="
                  sidebarCollapsed()
                    ? 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-[#4255FF] no-underline hover:bg-gray-100 transition-colors'
                    : 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-[#91a1ff] no-underline hover:bg-white/8 transition-colors'
                "
              >
                <span class="material-symbols-outlined text-[20px] text-[#4255FF]"
                  >admin_panel_settings</span
                >
                Admin Panel
              </a>
            }
            <div
              [class]="
                sidebarCollapsed() ? 'h-px bg-gray-100 mx-2 my-1' : 'h-px bg-white/8 mx-2 my-1'
              "
            ></div>
            <button
              (click)="logout()"
              [class]="
                sidebarCollapsed()
                  ? 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-red-500 w-full bg-transparent border-none cursor-pointer hover:bg-gray-100 transition-colors'
                  : 'flex items-center gap-2.5 px-3.5 py-2.5 rounded-[12px] text-[0.85rem] font-semibold text-red-300 w-full bg-transparent border-none cursor-pointer hover:bg-red-500/10 transition-colors'
              "
            >
              <span class="material-symbols-outlined text-[20px] text-red-400">logout</span>
              Log out
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <div class="flex-1 min-w-0 overflow-hidden bg-[#f4f6fb]">
    <div class="h-full overflow-y-auto">
      <router-outlet />
    </div>
  </div>
</div>
