<div class="flex h-screen bg-[#F0F2FF] font-[Inter]">
  <!-- Sidebar -->
  <aside class="w-60 min-w-[240px] bg-[#0f0a1e] flex flex-col shadow-2xl transition-all duration-300">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-white/5">
      <img src="images/logo.png" alt="MyQuiz" style="height: 40px" class="h-9 w-auto drop-shadow-lg">
      <span class="px-2 py-0.5 rounded-md bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-[10px] font-black tracking-widest uppercase shadow-sm mt-0.5">Admin</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!bg-indigo-600 !text-white"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 font-semibold text-[13.5px] no-underline transition-all hover:bg-white/10 hover:text-white"
        >
          <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Back to App + User -->
    <div class="px-3 py-4 border-t border-white/5 space-y-2">
      <button
        (click)="goToApp()"
        class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-indigo-300 text-[13px] font-semibold hover:bg-white/10 transition-all border-none bg-transparent cursor-pointer"
      >
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        Back to App
      </button>

      @if (user()) {
        <div class="flex items-center gap-3 px-3 py-2.5 mt-1">
          <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white text-[13px] font-black shrink-0">
            {{ (user()!.firstName || 'A').charAt(0).toUpperCase() }}
          </div>
          <div class="min-w-0">
            <p class="text-white text-[12px] font-bold truncate">{{ user()!.firstName }} {{ user()!.lastName }}</p>
            <p class="text-slate-400 text-[10px] truncate">Administrator</p>
          </div>
          <button (click)="logout()" class="ml-auto text-slate-400 hover:text-red-400 transition-colors bg-transparent border-none cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">logout</span>
          </button>
        </div>
      }
    </div>
  </aside>

  <!-- Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 px-8 py-3.5 flex items-center justify-between shrink-0">
      

      <div class="flex items-center">
        <!-- Back to App button moved to Top Bar -->
        <button
          (click)="goToApp()"
          class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-gray-600 text-[12px] font-bold hover:bg-gray-100 transition-all border border-gray-200 bg-white cursor-pointer shadow-sm hover:shadow"
        >
          <span class="material-symbols-outlined text-[16px]">home</span>
          Back to App
        </button>
      </div>

      <div>
        <!-- Enlarged System Status -->
        @if (isSystemOnline()) {
          <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-green-50 border border-green-200 text-green-700 text-[12px] font-bold rounded-full shadow-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-green-600 animate-pulse"></span>
            System Online 
          </span>
        } @else {
          <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-red-50 border border-red-200 text-red-700 text-[12px] font-bold rounded-full shadow-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse"></span>
            System Offline
          </span>
        }
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
